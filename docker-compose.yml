# Local services for development only (ARCHITECTURE §6 "local").
# Credentials come from your untracked .env (copy .env.example). Nothing secret is committed.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pacific2
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
